<svg xmlns="http://www.w3.org/2000/svg" width="180" height="36" viewBox="0 0 180 36" id="gauzy-logo" class="gauzy-top-logo">
  <defs>
    <linearGradient id="obmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="obmsAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3B82F6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern Octapus/ERP Emblem -->
  <g transform="translate(2, 3)" filter="url(#subtleGlow)">
    <!-- Base geometric hexagon/cube -->
    <path d="M15 1 L28 8.5 L28 22.5 L15 30 L2 22.5 L2 8.5 Z" fill="url(#obmsGrad)"/>
    <!-- Inner faceted geometry -->
    <path d="M15 1 L28 8.5 L15 16 L2 8.5 Z" fill="#FFFFFF" fill-opacity="0.25"/>
    <path d="M15 16 L28 8.5 L28 22.5 L15 30 Z" fill="#000000" fill-opacity="0.15"/>
    <!-- Central Core Symbol -->
    <circle cx="15" cy="15.5" r="4.5" fill="#FFFFFF"/>
    <circle cx="15" cy="15.5" r="2.5" fill="url(#obmsAccent)"/>
  </g>

  <!-- Brand Typography -->
  <!-- "OBMS" -->
  <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="-0.02em" fill="#1E293B">
    OBMS
  </text>
  <!-- "ERP" Accent -->
  <text x="88" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="-0.01em" fill="url(#obmsGrad)">
    ERP
  </text>

  <!-- "POWERED BY OCTAPUS SYSTEM" Subtitle -->
  <text x="39" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="6.5" font-weight="700" letter-spacing="0.08em" fill="#64748B">
    POWERED BY OCTAPUS SYSTEM
  </text>
</svg>
